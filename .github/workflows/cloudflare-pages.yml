name: Deploy to Cloudflare Pages
# The site is served by Cloudflare Pages (project wireitct-website, custom domain www.wireitct.com) so the site has a working HTTPS cert on www. Every push to main deploys the files to Cloudflare.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect site files
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude .git --exclude .github --exclude CNAME ./ /tmp/site/
          ls -la /tmp/site
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy /tmp/site --project-name wireitct-website --branch main --commit-dirty=true
